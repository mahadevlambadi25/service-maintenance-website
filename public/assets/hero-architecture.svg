<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="640" height="460" role="img" aria-label="Architectural elevation schematic representing recurring property care, building repairs, and tenant improvements">
  <rect width="640" height="460" fill="#E4DCCE"/>
  <!-- Architectural grid lines -->
  <g stroke="#9B815D" stroke-opacity="0.35" stroke-width="1">
    <line x1="40" y1="60" x2="600" y2="60"/>
    <line x1="40" y1="140" x2="600" y2="140"/>
    <line x1="40" y1="220" x2="600" y2="220"/>
    <line x1="40" y1="300" x2="600" y2="300"/>
    <line x1="40" y1="380" x2="600" y2="380"/>
    <line x1="120" y1="30" x2="120" y2="410"/>
    <line x1="280" y1="30" x2="280" y2="410"/>
    <line x1="440" y1="30" x2="440" y2="410"/>
  </g>
  <!-- Commercial Building Elevation -->
  <rect x="84" y="108" width="472" height="272" fill="#F4F0E8" stroke="#24251F" stroke-width="2.5"/>
  <!-- Parapet & Roofline -->
  <rect x="76" y="96" width="488" height="14" fill="#24251F"/>
  <!-- Warehouse High-Bay Section -->
  <rect x="108" y="140" width="160" height="240" fill="#E4DCCE" stroke="#24251F" stroke-width="1.5"/>
  <rect x="132" y="232" width="112" height="148" fill="#F4F0E8" stroke="#24251F" stroke-width="1.5"/>
  <line x1="132" y1="268" x2="244" y2="268" stroke="#625F55" stroke-width="1"/>
  <line x1="132" y1="304" x2="244" y2="304" stroke="#625F55" stroke-width="1"/>
  <line x1="132" y1="340" x2="244" y2="340" stroke="#625F55" stroke-width="1"/>
  <!-- Protective Bollards -->
  <rect x="116" y="352" width="8" height="28" fill="#6B3026"/>
  <rect x="252" y="352" width="8" height="28" fill="#6B3026"/>
  <!-- Retail / Office Suite Bay -->
  <rect x="292" y="140" width="240" height="240" fill="#F4F0E8" stroke="#24251F" stroke-width="1.5"/>
  <!-- Clerestory & Storefront Glazing -->
  <rect x="312" y="160" width="90" height="58" fill="#E4DCCE" stroke="#24251F" stroke-width="1.5"/>
  <rect x="422" y="160" width="90" height="58" fill="#E4DCCE" stroke="#24251F" stroke-width="1.5"/>
  <rect x="312" y="246" width="128" height="134" fill="#E4DCCE" stroke="#24251F" stroke-width="1.5"/>
  <rect x="454" y="246" width="58" height="134" fill="#6B3026"/>
  <circle cx="464" cy="316" r="3" fill="#F4F0E8"/>
  <!-- Ground Plane -->
  <line x1="40" y1="380" x2="600" y2="380" stroke="#24251F" stroke-width="3"/>
  <!-- Dimension Callouts -->
  <text x="84" y="76" fill="#24251F" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="1.2">COMMERCIAL ASSET SCOPE SCHEMATIC — GREATER PHOENIX</text>
  <text x="118" y="408" fill="#625F55" font-family="system-ui, sans-serif" font-size="11" font-weight="600">01 INDUSTRIAL &amp; DOCK</text>
  <text x="312" y="408" fill="#625F55" font-family="system-ui, sans-serif" font-size="11" font-weight="600">02 RETAIL &amp; OFFICE SUITES</text>
</svg>
